<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Survivors 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }

    /* Panel de debug — único overlay del proyecto (ver PerformanceMonitor.js) */
    #debug-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      padding: 10px 14px;
      background: rgba(13, 17, 23, 0.82);
      border: 1px solid rgba(57, 208, 255, 0.35);
      border-radius: 6px;
      color: #cfe6f5;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre;
      pointer-events: none;
    }

    /* ── HUD ──────────────────────────────────────────────────────────────
       Estilo neutro a propósito: la identidad visual (§6.1 del GDD) todavía
       no está decidida. Cuando se decida, se cambian los colores acá y en
       GameConfig.WORLD, no repartidos por el código. */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      color: #cfe6f5;
    }

    #hud-top {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 92vw);
      text-align: center;
    }

    #hud-hp {
      position: relative;
      height: 22px;
      border: 1px solid rgba(57, 208, 255, 0.35);
      border-radius: 11px;
      background: rgba(13, 17, 23, 0.72);
      overflow: hidden;
    }

    #hud-hp-fill {
      height: 100%;
      width: 100%;
      background: #39d0ff;
      transition: width 0.12s linear, background 0.3s;
    }

    #hud-hp-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 1px;
      color: #0d1117;
      font-weight: 700;
    }

    #hud-xp {
      position: relative;
      height: 12px;
      margin-top: 4px;
      border: 1px solid rgba(139, 255, 176, 0.28);
      border-radius: 6px;
      background: rgba(13, 17, 23, 0.72);
      overflow: hidden;
    }

    #hud-xp-fill {
      height: 100%;
      width: 0;
      background: #8bffb0;
      transition: width 0.15s linear;
    }

    #hud-level {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 1px;
      color: #cfe6f5;
      mix-blend-mode: difference;
    }

    #hud-stats {
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #7f9bb0;
      white-space: pre;
    }

    /* Barra del boss: separada del bloque de arriba, ancha, imposible de
       confundir con la vida del jugador. */
    #hud-boss {
      position: absolute;
      top: 108px;
      left: 50%;
      transform: translateX(-50%);
      width: min(640px, 94vw);
      text-align: center;
    }

    #hud-boss[hidden] {
      display: none !important;
    }

    #hud-boss-name {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #ffd166;
      text-transform: uppercase;
    }

    #hud-boss-bar {
      height: 10px;
      border: 1px solid rgba(255, 209, 102, 0.45);
      border-radius: 5px;
      background: rgba(13, 17, 23, 0.8);
      overflow: hidden;
    }

    #hud-boss-fill {
      height: 100%;
      width: 100%;
      background: #ffd166;
      transition: width 0.1s linear;
    }

    #hud-weapons {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .wcard {
      width: 104px;
      /* Alto fijo y sin cortes de línea: si una tarjeta crece porque el nombre
         es largo, la fila queda despareja y se lee como un error. */
      height: 58px;
      white-space: nowrap;
      overflow: hidden;
      padding: 7px 7px 6px;
      border: 1px solid rgba(127, 155, 176, 0.25);
      border-radius: 8px;
      background: rgba(13, 17, 23, 0.78);
      color: #566d80;
      font: inherit;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .wcard:hover {
      opacity: 0.85;
    }

    /* Equipada: se enciende con el color del arma */
    .wcard.equipped {
      opacity: 1;
      color: #cfe6f5;
      border-color: var(--w-color);
      box-shadow: 0 0 12px -4px var(--w-color);
    }



    /* El nombre más largo ("Francotirador") no entra: se recorta con puntos
       suspensivos en vez de quedar cortado a la mitad. */
    .wname {
      display: inline-block;
      max-width: 68px;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
      font-size: 12px;
    }

    .wstat {
      display: block;
      margin: 4px 0 6px;
      font-size: 10px;
      color: #566d80;
    }

    .wcard.equipped .wstat {
      color: #7f9bb0;
    }

    /* Barra de enfriamiento: llena = lista para disparar */
    .wcool {
      display: block;
      height: 3px;
      border-radius: 2px;
      background: rgba(127, 155, 176, 0.18);
      overflow: hidden;
    }

    .wcool i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--w-color);
    }

    @media (max-width: 768px) {
      #hud-weapons {
        flex-wrap: wrap;
        justify-content: center;
        width: 96vw;
        bottom: 12px;
      }

      .wcard {
        width: 88px;
        height: 54px;
      }
    }

    /* ── Menú de inicio: elección del arma base ────────────────────────── */
    #start-menu[hidden] {
      display: none !important;
    }

    #start-menu {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 5vh 0;
      overflow-y: auto;
      background: #0d1117;
      color: #cfe6f5;
    }

    .smenu {
      width: min(900px, 94vw);
      text-align: center;
    }

    .smenu h1 {
      font-size: 34px;
      letter-spacing: 8px;
      color: #39d0ff;
    }

    .ssub {
      margin: 10px 0 26px;
      font-size: 13px;
      line-height: 1.6;
      color: #7f9bb0;
    }

    .scards {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .scard {
      width: 250px;
      padding: 18px 16px;
      border: 1px solid rgba(127, 155, 176, 0.3);
      border-top: 3px solid var(--s-color);
      border-radius: 10px;
      background: rgba(22, 28, 37, 0.95);
      color: #cfe6f5;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
    }

    .scard:hover {
      transform: translateY(-4px);
      border-color: var(--s-color);
      background: rgba(32, 41, 54, 0.98);
    }

    .srole {
      display: block;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--s-color);
      text-transform: uppercase;
    }

    .sname {
      display: block;
      margin: 8px 0 10px;
      font-size: 20px;
    }

    .sname b {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 6px;
      border-radius: 4px;
      background: var(--s-color);
      color: #0d1117;
      text-align: center;
      line-height: 20px;
      font-size: 12px;
    }

    .sdesc {
      display: block;
      min-height: 56px;
      font-size: 12px;
      line-height: 1.6;
      color: #7f9bb0;
    }

    .sstats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(127, 155, 176, 0.18);
      font-size: 11px;
      color: #566d80;
    }

    .sstats i {
      color: #cfe6f5;
      font-style: normal;
      font-weight: 700;
    }

    .shint {
      margin-top: 24px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #566d80;
    }


    .shead {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .scoin {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 209, 102, 0.35);
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.08);
      font-size: 15px;
      color: #ffd166;
    }

    .scoin i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
    }

    .scard.selected {
      border-color: var(--s-color);
      background: rgba(32, 41, 54, 0.98);
      box-shadow: 0 0 0 1px var(--s-color), 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .scard.up .srole {
      color: #ffd166;
    }

    /* ── Taller: mejoras permanentes del arma marcada ──────────────────── */
    .sshop {
      margin-top: 18px;
      padding: 14px 16px 10px;
      border: 1px solid rgba(127, 155, 176, 0.22);
      border-radius: 10px;
      background: rgba(17, 22, 30, 0.9);
      text-align: left;
    }

    .stitle {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(127, 155, 176, 0.18);
    }

    .stitle b {
      font-size: 14px;
      letter-spacing: 1px;
    }

    .stitle span {
      font-size: 11px;
      color: #566d80;
    }

    .trow {
      display: grid;
      grid-template-columns: 150px 1fr auto 64px;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(127, 155, 176, 0.08);
    }

    .tname {
      font-size: 13px;
      color: #8fa9bd;
    }

    .trow.owned .tname {
      color: #cfe6f5;
    }

    .tdesc {
      font-size: 11px;
      color: #566d80;
    }

    .tpips {
      display: inline-flex;
      gap: 3px;
    }

    .tpips i {
      width: 14px;
      height: 5px;
      border-radius: 2px;
      background: rgba(127, 155, 176, 0.22);
    }

    .tpips i.on {
      background: #ffd166;
    }

    .tbuy {
      padding: 5px 0;
      border: 1px solid rgba(255, 209, 102, 0.4);
      border-radius: 6px;
      background: rgba(255, 209, 102, 0.1);
      color: #ffd166;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .tbuy:hover:not(:disabled) {
      background: rgba(255, 209, 102, 0.22);
    }

    /* Sin moneda suficiente: se ve el precio pero no se puede apretar. */
    .tbuy:disabled {
      border-color: rgba(127, 155, 176, 0.2);
      background: none;
      color: #48596a;
      cursor: default;
    }

    .tmax {
      font-size: 11px;
      text-align: center;
      color: #566d80;
    }

    .sprofile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 11px;
      color: #566d80;
    }

    .twipe {
      padding: 4px 10px;
      border: 1px solid rgba(255, 77, 109, 0.3);
      border-radius: 6px;
      background: none;
      color: #ff4d6d;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .twipe:hover {
      background: rgba(255, 77, 109, 0.12);
    }

    .sfoot {
      margin-top: 20px;
    }

    .splay {
      padding: 12px 46px;
      border: none;
      border-radius: 8px;
      background: #39d0ff;
      color: #0d1117;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
    }

    .splay:hover {
      background: #6fdeff;
    }

    /* ── Laboratorio de habilidades (solo desarrollo) ──────────────────── */
    #skill-lab[hidden] {
      display: none !important;
    }

    #skill-lab {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 150;
      width: 340px;
      overflow-y: auto;
      padding: 14px;
      background: rgba(9, 12, 17, 0.94);
      border-left: 1px solid rgba(57, 208, 255, 0.25);
      color: #cfe6f5;
      font-size: 12px;
    }

    .ltitle {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(127, 155, 176, 0.2);
    }

    .ltitle span {
      font-size: 10px;
      color: #566d80;
    }

    .lactions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    #skill-lab button {
      padding: 5px 9px;
      border: 1px solid rgba(127, 155, 176, 0.3);
      border-radius: 5px;
      background: rgba(32, 41, 54, 0.9);
      color: #cfe6f5;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    #skill-lab button:hover {
      border-color: #39d0ff;
    }

    .lrow {
      margin-bottom: 14px;
      padding: 10px;
      border: 1px solid rgba(127, 155, 176, 0.18);
      border-left: 3px solid rgba(127, 155, 176, 0.25);
      border-radius: 7px;
      background: rgba(22, 28, 37, 0.7);
    }

    .lrow.active {
      border-left-color: var(--l-color);
      background: rgba(32, 41, 54, 0.85);
    }

    .lhead {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .lname {
      font-size: 14px;
      color: var(--l-color);
    }

    .lkind {
      font-size: 9px;
      letter-spacing: 0.5px;
      color: #566d80;
      text-align: right;
    }

    .ldesc {
      margin: 6px 0 9px;
      font-size: 11px;
      line-height: 1.5;
      color: #7f9bb0;
    }

    .lctl {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }

    .llevel {
      min-width: 34px;
      text-align: center;
      font-weight: 700;
    }

    .lstats {
      font-size: 10px;
      color: #7f9bb0;
    }

    .ltable {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      color: #566d80;
    }

    .ltable td {
      padding: 2px 4px;
      border-top: 1px solid rgba(127, 155, 176, 0.12);
    }

    .ltable tr.now td {
      color: #cfe6f5;
      background: rgba(57, 208, 255, 0.1);
    }

    .lfoot {
      margin-top: 12px;
      font-size: 10px;
      line-height: 1.5;
      color: #566d80;
    }

    .lfoot code {
      color: #8bffb0;
    }

    /* Etiqueta y niveles de las tarjetas del HUD */
    .wtag {
      display: block;
      font-size: 8px;
      letter-spacing: 1.5px;
      color: var(--w-color);
    }

    .wpips {
      display: flex;
      gap: 3px;
      margin-top: 6px;
    }

    .wpips i {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(127, 155, 176, 0.22);
    }

    .wpips i.on {
      background: var(--w-color);
    }

    /* ── Menú de mejoras (subida de nivel) ─────────────────────────────── */

    /* Va primero y con !important porque `display: flex` le gana al atributo
       hidden del HTML: sin esto el overlay oscurece la pantalla para siempre. */
    #upgrade-menu[hidden] {
      display: none !important;
    }

    #upgrade-menu {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 17, 23, 0.82);
      color: #cfe6f5;
    }

    .umenu {
      text-align: center;
      width: min(880px, 94vw);
    }

    .umenu h2 {
      font-size: 26px;
      letter-spacing: 4px;
      color: #8bffb0;
    }

    .usub {
      margin: 6px 0 22px;
      font-size: 12px;
      color: #7f9bb0;
      letter-spacing: 1px;
    }

    .ucards {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .ucard {
      width: 190px;
      min-height: 130px;
      padding: 14px 13px;
      border: 1px solid var(--u-color);
      border-left: 4px solid var(--u-color);
      border-radius: 10px;
      background: rgba(22, 28, 37, 0.95);
      color: #cfe6f5;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }

    .ucard:hover {
      transform: translateY(-3px);
      background: rgba(32, 41, 54, 0.98);
    }

    .utag {
      display: block;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--u-color);
      text-transform: uppercase;
    }

    .uname {
      display: block;
      margin: 8px 0 8px;
      font-size: 15px;
    }

    .uname b {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 5px;
      border-radius: 4px;
      background: var(--u-color);
      color: #0d1117;
      text-align: center;
      line-height: 18px;
      font-size: 11px;
    }

    .udesc {
      display: block;
      font-size: 12px;
      line-height: 1.5;
      color: #7f9bb0;
    }

    /* Fin de partida provisorio (el menú completo es la Parte G) */
    #game-over {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(13, 17, 23, 0.78);
      color: #ff4d6d;
      letter-spacing: 2px;
    }

    #game-over h1 {
      font-size: 40px;
      font-weight: 700;
    }

    #game-over p {
      margin-top: 12px;
      font-size: 14px;
      color: #cfe6f5;
    }

    #game-over .reward {
      margin-top: 6px;
      color: #ffd166;
      font-size: 18px;
    }

    #game-over .reward i {
      font-style: normal;
      font-size: 13px;
      color: #7f9bb0;
    }

    #game-over .hint {
      margin-top: 22px;
      color: #7f9bb0;
      font-size: 12px;
    }

    /* Zona del joystick virtual — solo en pantallas chicas */
    #zone_joystick {
      position: fixed;
      bottom: 28px;
      left: 28px;
      width: 150px;
      height: 150px;
      z-index: 90;
    }

    @media (min-width: 769px) {
      #zone_joystick {
        display: none;
      }
    }

    /* En pantallas angostas el panel de debug se superpone con el HUD. Gana el
       HUD, que es del juego: el panel baja y se transparenta. */
    @media (max-width: 900px) {
      #debug-panel {
        top: 96px;
        opacity: 0.75;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="zone_joystick"></div>

  <!-- Un solo script de juego. Sin excepciones (GDD_v2 §1). -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
